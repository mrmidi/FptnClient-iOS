name: FptnCLI

options:
  bundleIdPrefix: net.mrmidi
  deploymentTarget:
    macOS: "13.0"

    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../Fptn-macOS/Cpp
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../Fptn-macOS/Cpp/fptn_native_lib.framework/Versions/1.0.0/Headers
    CLANG_CXX_LANGUAGE_STANDARD: c++20

configs:
  Debug: debug
  Release: release

packages:
  FptnShared:
    url: https://github.com/mrmidi/FptnShared.git
    exactVersion: "0.3.0-alpha.1"

targets:

  FptnNativeTransport_macOS:
    type: framework.static
    platform: macOS
    sources:
      - Targets/FptnNativeTransport/Sources
    dependencies:
      - package: FptnShared
        product: FptnSharedCore
      - package: FptnShared
        product: FptnServerSelection
      - framework: ../Fptn-macOS/Cpp/fptn_native_lib.framework
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../Fptn-macOS/Cpp
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../Fptn-macOS/Cpp/fptn_native_lib.framework/Versions/1.0.0/Headers

  FptnSelectionCLI:
    type: tool
    platform: macOS
    sources:
      - Targets/FptnSelectionCLI/Sources
    dependencies:
      - target: FptnNativeTransport_macOS
      - package: FptnShared
        product: FptnSharedCore
      - package: FptnShared
        product: FptnServerSelection
      - package: FptnShared
        product: FptnConnectionOrchestration
      - package: FptnShared
        product: FptnSharedTestSupport
      - framework: ../Fptn-macOS/Cpp/fptn_native_lib.framework
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../Fptn-macOS/Cpp
        SWIFT_CXX_INTEROPERABILITY_MODE: default

schemes:
  FptnSelectionCLI:
    build:
      targets:
        FptnSelectionCLI: all
    run:
      config: Debug
