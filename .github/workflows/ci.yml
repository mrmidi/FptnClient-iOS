name: CI

on:
  push:
  pull_request:

jobs:
  xcode:
    name: Xcode (FptnVPN)
    runs-on: macos-26

    env:
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          set -euo pipefail

          # Ensure Homebrew tools are visible (Xcode shells may have a minimal PATH).
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          # Ensure CMake and Conan are available.
          # Use Homebrew (runner Python is PEP-668 externally managed).
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v conan >/dev/null 2>&1; then
            brew install conan
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

          cmake --version
          conan --version
          xcodegen --version
          xcbeautify --version

      - name: Cache Conan
        id: cache-conan
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('FptnLib/conanfile.py', 'FptnLib/**/conan-*-profile') }}

      - name: Build native frameworks
        run: |
          set -euo pipefail

          # Conan v2 requires a build profile; create/update the default one.
          conan profile detect --force

          # Builds and copies frameworks into the Xcode-consumed locations:
          # - Fptn-macOS/Cpp + Fptn-macOS-Tunnel/Cpp
          # - FptnVPN/Cpp (iOS simulator slice)
          ./build_fptn_lib.sh macos
          ./build_fptn_lib.sh ios-simulator

      - name: Save Conan cache
        if: always() && steps.cache-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('FptnLib/conanfile.py', 'FptnLib/**/conan-*-profile') }}

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Restore DerivedData cache
        id: cache-deriveddata
        uses: actions/cache/restore@v5
        with:
          path: .build/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', 'project.yml', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: macOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "Fptn-macOS" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -skip-testing:"Fptn-macOSUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify

      - name: iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "FptnVPN" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath "$DERIVED_DATA" \
            -skip-testing:"FptnVPNUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify

      - name: Save DerivedData cache
        if: always() && steps.cache-deriveddata.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', 'project.yml', '**/Package.resolved') }}
