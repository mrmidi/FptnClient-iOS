name: CI

on:
  push:
  pull_request:

jobs:
  xcode:
    name: Xcode (FptnVPN)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: macOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "Fptn-macOS" \
            -configuration Debug \
            -destination "platform=macOS" \
            -skip-testing:"Fptn-macOSUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify

      - name: iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "FptnVPN" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -skip-testing:"FptnVPNUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify
