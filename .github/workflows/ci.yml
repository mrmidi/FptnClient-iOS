name: CI

on:
  push:
  pull_request:

jobs:
  xcode:
    name: Xcode (FptnVPN)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          set -euo pipefail

          # Ensure Homebrew tools are visible (Xcode shells may have a minimal PATH).
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          # Ensure CMake and Conan are available.
          # Use Homebrew (runner Python is PEP-668 externally managed).
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v conan >/dev/null 2>&1; then
            brew install conan
          fi

          cmake --version
          conan --version

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('FptnLib/conanfile.py', 'FptnLib/**/conan-*-profile') }}

      - name: Build native frameworks
        run: |
          set -euo pipefail

          # Conan v2 requires a build profile; create/update the default one.
          conan profile detect --force

          # Builds and copies frameworks into the Xcode-consumed locations:
          # - Fptn-macOS/Cpp + Fptn-macOS-Tunnel/Cpp
          # - FptnVPN/Cpp (iOS simulator slice)
          ./build_fptn_lib.sh macos
          ./build_fptn_lib.sh ios-simulator

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: macOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "Fptn-macOS" \
            -configuration Debug \
            -destination "platform=macOS" \
            -skip-testing:"Fptn-macOSUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify

      - name: iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FptnVPN.xcodeproj \
            -scheme "FptnVPN" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -skip-testing:"FptnVPNUITests" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          | xcbeautify
