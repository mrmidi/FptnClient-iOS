name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-and-release:
    name: Build & Publish
    runs-on: macos-26

    env:
      KEYCHAIN_NAME: build.keychain-db
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
      UPLOAD_TO_APP_STORE_CONNECT: ${{ secrets.UPLOAD_TO_APP_STORE_CONNECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3600))
          run_id=""
          run_url=""

          while (( SECONDS < deadline )); do
            run_json="$(
              gh run list \
                --workflow "CI" \
                --commit "$GITHUB_SHA" \
                --json conclusion,databaseId,status,url \
                --limit 20
            )"

            run_data="$(
              RUN_JSON="$run_json" python3 -c 'import json, os; runs = json.loads(os.environ["RUN_JSON"]); run = runs[0] if runs else {}; print("{databaseId}\t{url}\t{status}\t{conclusion}".format(databaseId=run.get("databaseId", ""), url=run.get("url", ""), status=run.get("status", ""), conclusion=run.get("conclusion") or ""))'
            )"
            IFS=$'\t' read -r run_id run_url run_status run_conclusion <<< "$run_data"

            if [[ -z "$run_id" ]]; then
              echo "Waiting for CI workflow to start for $GITHUB_SHA..."
              sleep 30
              continue
            fi

            echo "CI run: $run_url"
            case "$run_status:$run_conclusion" in
              completed:success)
                echo "CI completed successfully."
                exit 0
                ;;
              completed:*)
                echo "CI completed with conclusion '${run_conclusion:-unknown}'. Refusing to release." >&2
                exit 1
                ;;
              *)
                echo "CI is still ${run_status}; waiting..."
                sleep 30
                ;;
            esac
          done

          echo "Timed out waiting for CI to complete for $GITHUB_SHA." >&2
          exit 1

      - name: Install build prerequisites
        run: |
          set -euo pipefail

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v conan >/dev/null 2>&1; then
            brew install conan
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          cmake --version
          conan --version
          xcodegen --version

      - name: Cache Conan
        id: cache-conan
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('FptnLib/conanfile.py', 'FptnLib/**/conan-*-profile') }}

      - name: Save Conan cache
        if: always() && steps.cache-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('FptnLib/conanfile.py', 'FptnLib/**/conan-*-profile') }}

      - name: Set up Apple signing keychain
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"

          if [[ -z "${APPLE_CERTIFICATE_P12_B64:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Missing APPLE_CERTIFICATE_P12_B64 / APPLE_CERTIFICATE_PASSWORD secrets." >&2
            exit 1
          fi

          CERT_P12="$RUNNER_TEMP/signing-cert.p12"
          echo "$APPLE_CERTIFICATE_P12_B64" | /usr/bin/base64 -D > "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prefer this keychain for codesigning operations.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security import "$CERT_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_PRIVATE_KEY_B64:-}" ]]; then
            echo "Missing ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_B64 secrets." >&2
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_B64" | /usr/bin/base64 -D > "$KEY_PATH"
          chmod 0600 "$KEY_PATH"

          # iTMSTransporter expects API keys in ~/.private_keys/AuthKey_<KEY_ID>.p8
          mkdir -p "$HOME/.private_keys"
          cp "$KEY_PATH" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 0600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"

          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build native frameworks
        run: |
          set -euo pipefail
          conan profile detect --force

          ./build_fptn_lib.sh ios-device

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & export iOS IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${DEVELOPMENT_TEAM:-}" ]]; then
            echo "Missing DEVELOPMENT_TEAM secret." >&2
            exit 1
          fi

          if [[ -z "${ASC_KEY_PATH:-}" || -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "Missing App Store Connect API key env (ASC_KEY_PATH/ASC_KEY_ID/ASC_ISSUER_ID)." >&2
            exit 1
          fi

          BUILD_DIR="$RUNNER_TEMP/release-build"
          IOS_ARCHIVE="$BUILD_DIR/FptnVPN-iOS.xcarchive"
          IOS_EXPORT_DIR="$BUILD_DIR/ios-export"
          mkdir -p "$BUILD_DIR" "$IOS_EXPORT_DIR"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions-iOS.plist"
          EXPORT_OPTIONS="$EXPORT_OPTIONS" DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" python3 -c 'import os, plistlib; p=os.environ["EXPORT_OPTIONS"]; t=os.environ["DEVELOPMENT_TEAM"]; d={"method":"app-store","signingStyle":"automatic","teamID":t,"stripSwiftSymbols":True}; plistlib.dump(d, open(p,"wb"))'

          AUTH_ARGS=(
            -authenticationKeyPath "$ASC_KEY_PATH"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )

          xcodebuild archive \
            -project FptnVPN.xcodeproj \
            -scheme "FptnVPN" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$IOS_ARCHIVE" \
            -allowProvisioningUpdates \
            "${AUTH_ARGS[@]}" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath "$IOS_ARCHIVE" \
            -exportPath "$IOS_EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            "${AUTH_ARGS[@]}"

          IPA_PATH="$(find "$IOS_EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No .ipa found in $IOS_EXPORT_DIR" >&2
            exit 1
          fi
          cp "$IPA_PATH" "$GITHUB_WORKSPACE/FptnVPN-iOS.ipa"

      - name: Upload iOS IPA to App Store Connect (TestFlight)
        if: ${{ env.UPLOAD_TO_APP_STORE_CONNECT == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "Missing ASC_KEY_ID / ASC_ISSUER_ID." >&2
            exit 1
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/FptnVPN-iOS.ipa" ]]; then
            echo "Missing IPA artifact in workspace (expected FptnVPN-iOS.ipa)." >&2
            exit 1
          fi

          xcrun altool --upload-package "$GITHUB_WORKSPACE/FptnVPN-iOS.ipa" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --show-progress

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" \
            "$GITHUB_WORKSPACE/FptnVPN-iOS.ipa" \
            --clobber
