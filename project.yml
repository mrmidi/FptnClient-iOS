name: FptnVPN

options:
  bundleIdPrefix: net.mrmidi
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: F6YA6B56LR
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    STRIP_BITCODE_FROM_COPIED_FILES: NO
    SWIFT_OBJC_INTEROP_MODE: objcxx
    SWIFT_CXX_INTEROPERABILITY_MODE: default
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

packages:
  FptnShared:
    path: ../FptnShared
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.6.0"
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    from: "1.1.0"

# ── Target templates ───────────────────────────────────────────────────────────

targetTemplates:

  # Shared app settings
  AppBase:
    settings:
      base:
        ENABLE_PREVIEWS: YES

  # Shared network-extension settings
  TunnelBase:
    type: app-extension
    info:
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

# ── Targets ────────────────────────────────────────────────────────────────────

targets:

  # ── iOS App ──────────────────────────────────────────────────────────────────
  FptnVPN:
    templates: [AppBase]
    type: application
    platform: iOS
    sources:
      - path: FptnVPN
        excludes:
          - FptnVPNTunnel/**
          - Cpp/*.framework
          - Cpp/*.framework/**
          - Cpp/*.framework.dSYM
          - Cpp/*.framework.dSYM/**
      - SharedTunnelRuntime
      - path: fptn.icon
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: fptn
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.FptnVPN
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/FptnVPN/Cpp
        OTHER_LDFLAGS: [-ObjC]
        SWIFT_OBJC_BRIDGING_HEADER: FptnVPN/Cpp/FptnVPN-Bridging-Header.h
    info:
      path: FptnVPN/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleIconName: fptn
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: FptnVPN/FptnVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
          - dns-settings
          - content-filter-provider
          - dns-proxy
          - app-proxy-provider
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.mrmidi.FptnVPN
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - target: FptnVPNTunnel
        embed: true
      - package: FptnShared
        product: FptnSharedCore
      - package: FptnShared
        product: FptnServerSelection
      - package: swift-log
        product: Logging
      - package: swift-collections
        product: Collections
      - framework: FptnVPN/Cpp/fptn_native_lib.framework
        embed: true
        codeSign: false
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Sign FptnLib Framework
        script: |
          FRAMEWORK="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/fptn_native_lib.framework"
          if [ -d "${FRAMEWORK}" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            /usr/bin/codesign --remove-signature "${FRAMEWORK}" >/dev/null 2>&1 || true
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:-}}"
            if [ -z "${SIGN_IDENTITY}" ] || [ "${SIGN_IDENTITY}" = "Don't Code Sign" ]; then
              SIGN_IDENTITY="-"
            fi
            /usr/bin/codesign --force --sign "${SIGN_IDENTITY}" --timestamp=none --generate-entitlement-der "${FRAMEWORK}"
          fi
        basedOnDependencyAnalysis: false

  # ── iOS Network Extension ─────────────────────────────────────────────────────
  FptnVPNTunnel:
    templates: [TunnelBase]
    platform: iOS
    sources:
      - FptnVPNTunnel
      - SharedTunnelRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.FptnVPN.FptnVPNTunnel
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/FptnVPN/Cpp
        SWIFT_OBJC_BRIDGING_HEADER: FptnVPNTunnel/Cpp/FptnVPNTunnel-Bridging-Header.h
    info:
      path: FptnVPNTunnel/Info.plist
    entitlements:
      path: FptnVPNTunnel/FptnVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
    dependencies:
      - package: swift-log
        product: Logging
      - framework: FptnVPN/Cpp/fptn_native_lib.framework
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false

  # ── macOS App ─────────────────────────────────────────────────────────────────
  Fptn-macOS:
    templates: [AppBase]
    type: application
    platform: macOS
    sources:
      - path: Fptn-macOS
        excludes:
          - Fptn-macOS-Tunnel/**
          - Cpp/*.framework
          - Cpp/*.framework/**
          - Cpp/*.framework.dSYM
          - Cpp/*.framework.dSYM/**
      - SharedTunnelRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.Fptn-macOS
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Fptn-macOS/Cpp
        SWIFT_OBJC_BRIDGING_HEADER: Fptn-macOS/Cpp/Fptn_macOS-Bridging-Header.h
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Fptn-macOS/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: Fptn-macOS/Fptn_macOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.mrmidi.FptnVPN
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)net.mrmidi.FptnVPN
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - target: Fptn-macOS-Tunnel
        embed: true
      - package: FptnShared
        product: FptnSharedCore
      - framework: Fptn-macOS/Cpp/fptn_native_lib.framework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false

  # ── macOS Network Extension ───────────────────────────────────────────────────
  Fptn-macOS-Tunnel:
    templates: [TunnelBase]
    platform: macOS
    sources:
      - Fptn-macOS-Tunnel
      - SharedTunnelRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.Fptn-macOS.Fptn-macOS-Tunnel
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Fptn-macOS-Tunnel/Cpp
        SWIFT_OBJC_BRIDGING_HEADER: Fptn-macOS-Tunnel/Cpp/Fptn_macOS_Tunnel-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Fptn-macOS-Tunnel/Info.plist
    entitlements:
      path: Fptn-macOS-Tunnel/Fptn_macOS_Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
    dependencies:
      - framework: Fptn-macOS-Tunnel/Cpp/fptn_native_lib.framework
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false

  # ── tvOS App ──────────────────────────────────────────────────────────────────
  Fptn-tvOS:
    templates: [AppBase]
    type: application
    platform: tvOS
    sources:
      - path: Fptn-tvOS
        excludes:
          - Fptn-tvOS-Tunnel/**
          - Cpp/*.framework
          - Cpp/*.framework/**
          - Cpp/*.framework.dSYM
          - Cpp/*.framework.dSYM/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.Fptn-macOS.Fptn-tvOS
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Fptn-tvOS/Cpp
        SWIFT_OBJC_BRIDGING_HEADER: Fptn-tvOS/Cpp/Fptn_tvOS-Bridging-Header.h
    info:
      path: Fptn-tvOS/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Fptn-tvOS/Fptn_tvOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.net.mrmidi.FptnVPN
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)net.mrmidi.FptnVPN
    dependencies:
      - target: Fptn-tvOS-Tunnel
        embed: true
      - package: FptnShared
        product: FptnSharedCore
      - framework: Fptn-tvOS/Cpp/fptn_native_lib.framework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false

  # ── tvOS Network Extension ────────────────────────────────────────────────────
  Fptn-tvOS-Tunnel:
    templates: [TunnelBase]
    platform: tvOS
    sources:
      - Fptn-tvOS-Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.Fptn-macOS.Fptn-tvOS.Fptn-tvOS-Tunnel
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Fptn-tvOS-Tunnel/Cpp
        SWIFT_OBJC_BRIDGING_HEADER: Fptn-tvOS-Tunnel/Cpp/Fptn_tvOS_Tunnel-Bridging-Header.h
    info:
      path: Fptn-tvOS-Tunnel/Info.plist
    entitlements:
      path: Fptn-tvOS-Tunnel/Fptn_tvOS_Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.net.mrmidi.FptnVPN
    dependencies:
      - package: FptnShared
        product: FptnSharedCore
      - framework: Fptn-tvOS-Tunnel/Cpp/fptn_native_lib.framework
    preBuildScripts:
      - name: Build FptnLib (Conan+CMake)
        script: 'FPTN_NATIVE_BUILD_IF_MISSING=1 "${SRCROOT}/build_fptn_lib.sh"'
        basedOnDependencyAnalysis: false

  # ── Tests ─────────────────────────────────────────────────────────────────────
  FptnVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FptnVPNTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fptn.FptnVPNTests
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/FptnVPN/Cpp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FptnVPN

  Fptn-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Fptn-macOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mrmidi.Fptn-macOSTests
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Fptn-macOS/Cpp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fptn-macOS
